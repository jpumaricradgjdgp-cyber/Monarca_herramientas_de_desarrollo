<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monarca - Login Panel de Control</title>
    <!-- Librería FontAwesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            
            <!-- Cabecera y Logo -->
            <div class="cabecera-login">
                <img src="../img/logo-desktop.png" alt="Logo Monarca" class="logo-monarca">
                <h2>Panel de Control</h2>
                <p class="subtitulo">Inicie sesión para gestionar el almacén</p>
            </div>

            <!-- Formulario -->
            <form id="form-login">
                
                <div class="grupo-input">
                    <label for="usuario">Usuario</label>
                    <div class="contenedor-icono">
                        <i class="fa-regular fa-user icono-izq"></i>
                        <input type="text" id="usuario" required>
                    </div>
                </div>

                <div class="grupo-input">
                    <label for="password">Contraseña</label>
                    <div class="contenedor-icono">
                        <i class="fa-solid fa-lock icono-izq"></i>
                        <input type="password" id="password" required>
                        <i class="fa-regular fa-eye icono-der" id="toggle-password" title="Mostrar contraseña"></i>
                    </div>
                </div>

                <button type="submit" class="btn-negro">Iniciar sesión</button>
            </form>

            <!-- Separador -->
            <div class="separador">
                <span>o</span>
            </div>

            <!-- Botón secundario -->
            <a href="../index.html" class="btn-blanco">Volver a la Tienda</a>

        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
